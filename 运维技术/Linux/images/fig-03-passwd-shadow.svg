<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" role="img">
<title>/etc/passwd 与 /etc/shadow 字段解析</title>
<desc>passwd 七个字段为用户名、密码占位、UID、GID、注释、家目录、登录 shell；shadow 九个字段为用户名、密码哈希、最后修改日、最小间隔、最大有效期、警告期、宽限期、过期日、保留。</desc>
<style>
svg{--c-text:#1f2328;--c-muted:#57606a;--c-border:rgba(0,0,0,.15);--f-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--f-sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
</style>

<text x="40" y="44" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">① /etc/passwd　权限应为 644，任何普通用户不可写</text>
<rect x="40" y="56" width="600" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="52" y="72" font-family="var(--f-mono)" font-size="12" fill="#0C447C" dominant-baseline="central">root:x:0:0:root:/root:/bin/bash</text>

<rect x="40" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="82" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">user</text>
<rect x="126" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="168" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">pwd</text>
<rect x="212" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="254" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">UID</text>
<rect x="298" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">GID</text>
<rect x="384" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="426" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">GECOS</text>
<rect x="470" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="512" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">home</text>
<rect x="556" y="98" width="84" height="32" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="598" y="114" font-family="var(--f-mono)" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">shell</text>

<text x="40" y="150" font-family="var(--f-sans)" font-size="12" fill="var(--c-text)" dominant-baseline="central">pwd 为 x 表示密码在 shadow；UID=0 即 root 权限，只允许一个</text>
<text x="40" y="170" font-family="var(--f-sans)" font-size="12" fill="var(--c-text)" dominant-baseline="central">shell 为 /sbin/nologin 或 /bin/false 表示禁止交互登录</text>

<text x="40" y="212" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#791F1F" dominant-baseline="central">② /etc/shadow　权限应为 000 或 600，仅 root 可读</text>
<rect x="40" y="224" width="600" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="52" y="240" font-family="var(--f-mono)" font-size="12" fill="#791F1F" dominant-baseline="central">root:$6$salt$hash:19800:0:90:7:5::</text>

<rect x="40" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="72" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">user</text>
<rect x="106" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="138" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">hash</text>
<rect x="172" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="204" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">last</text>
<rect x="238" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="270" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">min</text>
<rect x="304" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="336" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">max</text>
<rect x="370" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="402" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">warn</text>
<rect x="436" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="468" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">inact</text>
<rect x="502" y="266" width="64" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="534" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">expire</text>
<rect x="568" y="266" width="72" height="32" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="604" y="282" font-family="var(--f-mono)" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">rsvd</text>

<text x="40" y="318" font-family="var(--f-sans)" font-size="12" fill="var(--c-text)" dominant-baseline="central">hash 前缀：$6$ SHA512 / $5$ SHA256 / $y$ yescrypt / $1$ MD5 已不安全</text>
<text x="40" y="338" font-family="var(--f-sans)" font-size="12" fill="#A32D2D" dominant-baseline="central">hash 为 !! 或 * 表示锁定；字段为空表示空口令，必须杜绝</text>
<text x="40" y="358" font-family="var(--f-sans)" font-size="12" fill="var(--c-text)" dominant-baseline="central">max=有效期天数，warn=到期前警告天数，inact=过期后宽限天数</text>
<text x="40" y="378" font-family="var(--f-sans)" font-size="12" fill="var(--c-text)" dominant-baseline="central">last/min/max 等日期字段为距 1970-01-01 的天数，可用 chage -l 查看</text>
</svg>