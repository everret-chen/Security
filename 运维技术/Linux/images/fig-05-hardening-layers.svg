<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" role="img">
<title>Linux 安全加固的八个域</title>
<desc>加固分为身份鉴别、访问控制、网络服务、内核参数、补丁与软件五个管控域，以及安全审计、强制访问控制、核查工具三个检测与兜底域。</desc>
<style>
svg{--c-text:#1f2328;--c-muted:#57606a;--f-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--f-sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
</style>

<rect x="40" y="56" width="140" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">身份鉴别</text>
<text x="60" y="100" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">空口令 · 有效期</text>
<text x="60" y="118" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">复杂度 · 重用限制</text>
<text x="60" y="136" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">失败锁定 · 超时</text>

<rect x="192" y="56" width="140" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="212" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">访问控制</text>
<text x="212" y="100" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">权限基线 · umask</text>
<text x="212" y="118" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">SUID/SGID 清理</text>
<text x="212" y="136" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">sudo 最小授权</text>

<rect x="344" y="56" width="140" height="92" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="364" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">安全审计</text>
<text x="364" y="100" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">auditd 规则</text>
<text x="364" y="118" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">日志留存 180 天</text>
<text x="364" y="136" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">命令与外发审计</text>

<rect x="496" y="56" width="140" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="516" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">网络服务</text>
<text x="516" y="100" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">防火墙默认拒绝</text>
<text x="516" y="118" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">SSH 密钥登录</text>
<text x="516" y="136" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">关闭无用端口</text>

<rect x="40" y="160" width="140" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="182" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">内核参数</text>
<text x="60" y="204" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">sysctl 网络硬化</text>
<text x="60" y="222" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">ASLR · 禁重定向</text>
<text x="60" y="240" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">dmesg/ptrace 限制</text>

<rect x="192" y="160" width="140" height="92" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="212" y="182" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">强制访问</text>
<text x="212" y="204" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">SELinux Enforcing</text>
<text x="212" y="222" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">AppArmor 配置</text>
<text x="212" y="240" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">拒绝即写策略</text>

<rect x="344" y="160" width="140" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="364" y="182" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">补丁软件</text>
<text x="364" y="204" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">最小化安装</text>
<text x="364" y="222" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">及时更新内核</text>
<text x="364" y="240" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">仓库 GPG 校验</text>

<rect x="496" y="160" width="140" height="92" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="516" y="182" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">核查工具</text>
<text x="516" y="204" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">Lynis 基线扫描</text>
<text x="516" y="222" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">AIDE 完整性</text>
<text x="516" y="240" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">osquery/rkhunter</text>

<text x="40" y="280" font-family="var(--f-sans)" font-size="12" fill="var(--c-muted)" dominant-baseline="central">绿色为检测与兜底域：加固做得再好，也要能看见发生了什么</text>
</svg>