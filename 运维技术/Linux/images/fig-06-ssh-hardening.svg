<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 258" width="680" role="img">
<title>SSH 加固的四个控制点</title>
<desc>SSH 登录过程可划分为端口与监听、认证方式、账户授权、会话与审计四个控制点，并配合 fail2ban 与 auditd 做爆破防护与审计。</desc>
<style>
svg{--c-text:#1f2328;--c-muted:#57606a;--c-border:rgba(0,0,0,.15);--f-mono:ui-monospace,SFMono-Regular,Consolas,monospace;--f-sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
</style>

<rect x="40" y="56" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">① 端口监听</text>
<text x="60" y="102" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">改端口仅降噪</text>
<text x="60" y="120" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">ListenAddress 限定</text>

<rect x="192" y="56" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="212" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">② 认证方式</text>
<text x="212" y="102" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">Pubkey yes</text>
<text x="212" y="120" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">Password no</text>

<rect x="344" y="56" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="364" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">③ 账户授权</text>
<text x="364" y="102" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">PermitRootLogin no</text>
<text x="364" y="120" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">AllowGroups 白名单</text>

<rect x="496" y="56" width="140" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="516" y="78" font-family="var(--f-sans)" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">④ 会话审计</text>
<text x="516" y="102" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">ClientAlive 超时</text>
<text x="516" y="120" font-family="var(--f-sans)" font-size="11" fill="#185FA5" dominant-baseline="central">LoginGraceTime</text>

<rect x="40" y="148" width="596" height="66" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="172" font-family="var(--f-sans)" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">配套：fail2ban 自动封禁爆破源 + auditd 记录登录与关键文件变更</text>
<text x="60" y="192" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">改配置前先 sshd -t 校验语法；另开一个会话验证能登录，再断开当前连接</text>
<text x="60" y="206" font-family="var(--f-sans)" font-size="11" fill="#3B6D11" dominant-baseline="central">密钥文件权限：~/.ssh 700、authorized_keys 600，否则 sshd 会拒绝使用</text>

<text x="40" y="236" font-family="var(--f-sans)" font-size="12" fill="var(--c-muted)" dominant-baseline="central">改端口不等于安全：它只减少扫描噪声，真正的防线是禁用密码认证</text>
</svg>